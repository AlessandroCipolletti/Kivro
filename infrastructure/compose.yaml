name: kivro-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: kivro
      POSTGRES_USER: kivro
      POSTGRES_PASSWORD: kivro_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivro -d kivro"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024", "-volume.max=8", "-ip=storage", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:59000:8333"
    volumes:
      - object-data:/data
      - ./s3.local.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  mail:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_MAX_MESSAGES: 100
      MP_MAX_AGE: 24h
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  object-data:
